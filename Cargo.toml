[package]
name = "project-5_api"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A web API built with Fourbyfour"

[dependencies]
# Web framework - Updated to compatible versions
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database - Updated to modern version compatible with latest sqlx-cli
sqlx = { version = "0.8", features = [
    "postgres", 
    "runtime-tokio-rustls", 
    "macros", 
    "uuid", 
    "chrono",
    "migrate",
] }

# Utilities
dotenvy = "0.15"
uuid = { version = "1.6", features = ["serde", "v4"] }
chrono = { version = "0.4.31", features = ["serde"] }
anyhow = "1.0"

# Async runtime
tokio = { version = "1.29", features = ["macros", "rt-multi-thread", "signal"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-test = "0.4"
